name: Build independent DebugHook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Win32 MSVC
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DBUILD_TESTING=ON

      - name: Build production DLL and isolated tests
        run: cmake --build build --config Release --parallel 2

      - name: Run tests without an interactive graphics requirement
        run: ctest --test-dir build -C Release --output-on-failure --label-exclude interactive

      - name: Record renderer test boundary
        run: |
          'The D3D9 renderer tests are compiled but not run on the hosted runner.' >> $env:GITHUB_STEP_SUMMARY
          'Run ctest --test-dir build -C Release --output-on-failure -L interactive on an interactive Windows machine with a D3D9 device. Game tests are separate.' >> $env:GITHUB_STEP_SUMMARY

      - name: Package only production files
        run: ./scripts/package.ps1 -BinaryPath build/Release/gfdmdebug.dll

      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gfdmdebughook-windows-x86
          path: |
            dist/GFDM-DebugHook-x86-development.zip
            dist/GFDM-DebugHook-source-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gfdmdebughook-test-logs
          path: build/Testing/Temporary/*.log
          if-no-files-found: warn
